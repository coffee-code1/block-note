name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 锁定与 package.json 一致的版本：latest 的新版 CSS 规则会把
          # Astro/Svelte 的 @apply、:root.dark 等非标准语法误判为错误
          version: 2.2.5
      - name: Run Biome
        run: biome ci ./src --reporter=github
